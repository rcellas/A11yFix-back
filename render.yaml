services:
  - type: web
    name: a11yfix-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: pnpm install && pnpm playwright install chromium && pnpm build
    startCommand: pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: "*"
      - key: DATABASE_PATH
        value: data/a11yfix.sqlite
      - key: MAX_AUDIT_TIMEOUT_MS
        value: 60000
    healthCheckPath: /health
